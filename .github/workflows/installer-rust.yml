name: Installer Rust checks

on:
  push:
    paths:
      - "installer/**"
      - "server/alpha_sqlcipher_runtime.py"
      - "server/private_alpha_auth.py"
      - "server/sec01_host_commit_policy_sim.py"
      - "tests/conformance/test_alpha_sqlcipher_runtime.py"
      - ".github/workflows/installer-rust.yml"
  pull_request:
    paths:
      - "installer/**"
      - "server/alpha_sqlcipher_runtime.py"
      - "server/private_alpha_auth.py"
      - "server/sec01_host_commit_policy_sim.py"
      - "tests/conformance/test_alpha_sqlcipher_runtime.py"
      - ".github/workflows/installer-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache shared installer Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "installer -> target"
          shared-key: installer-core
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Offline installer release preparation tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Inspect transitive Alpha runtime imports (read-only)
        run: python scripts/audit_alpha_runtime_imports.py --json
      - name: Inspect Git and gh executable invocation sites (read-only)
        run: python scripts/audit_external_executables.py --json

  tauri-gui:
    name: Tauri GUI / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: installer/gui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Tauri Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "installer/gui/src-tauri -> target"
          shared-key: installer-gui
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Check Tauri Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Install locked GUI dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Test installer GUI validation and review (Node.js, all three OS)
        run: node --test
      - name: Build GUI frontend
        run: npm run web:build
      - name: Compile locked Tauri GUI Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Lint Tauri GUI Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test Tauri GUI Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  operational-sqlcipher:
    name: Operational SQLCipher / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned SQLCipher binary DB-API for actual encrypted tests
        run: python -m pip install --only-binary=:all: --no-deps sqlcipher3==0.6.4
      - name: Exercise encrypted runtime DB opens, wrong-key, and live transactions
        run: python -B -m unittest discover -s tests/conformance -p "test_alpha_sqlcipher_runtime.py" -v
      - name: Preserve existing Alpha auth regressions
        run: python -B -m unittest discover -s tests/conformance -p "test_private_alpha_auth.py" -v
      - name: Preserve existing Host policy regressions
        run: python -B -m unittest discover -s tests/conformance -p "test_sec01_host_commit_policy.py" -v
      - name: Audit Alpha import closure
        run: python installer/scripts/audit_alpha_runtime_imports.py --json
