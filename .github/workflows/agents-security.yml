name: AGENTS security guard

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'wip/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agents-security:
    name: AGENTS security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate committed AGENTS.md
        run: python3 -B scripts/check_agents_security.py
      - name: Scan changed documentation (committed content)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            python3 -B scripts/check_documentation_security.py --range "$BASE_SHA..HEAD"
          else
            python3 -B scripts/check_documentation_security.py --range "HEAD^..HEAD"
          fi
      - name: Scanner regression tests
        run: |
          python3 -B -m unittest discover -s tests/conformance -p 'test_agents_security.py' -v
          python3 -B -m unittest discover -s tests/conformance -p 'test_documentation_security.py' -v
