name: Game installation cross-platform security

# CI Policy v1: game-installation tests are not a gate for unrelated
# platform-installer commits. Shared Alpha/Host/security changes still trigger.
on:
  push:
    branches:
      - main
      - 'feat/game-integration-updates'
    paths:
      - "server/game_*.py"
      - "server/game_installation/**"
      - "server/sec01_*.py"
      - "server/private_alpha_gateway.py"
      - "server/private_alpha_auth.py"
      - "server/alpha_sqlcipher_runtime.py"
      - "server/host_runtime_config.py"
      - "tests/conformance/test_game_integration_install*.py"
      - "requirements-ci.txt"
      - ".github/workflows/game-installation-security.yml"
  pull_request:
    paths:
      - "server/game_*.py"
      - "server/game_installation/**"
      - "server/sec01_*.py"
      - "server/private_alpha_gateway.py"
      - "server/private_alpha_auth.py"
      - "server/alpha_sqlcipher_runtime.py"
      - "server/host_runtime_config.py"
      - "tests/conformance/test_game_integration_install*.py"
      - "requirements-ci.txt"
      - ".github/workflows/game-installation-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation-security:
    name: Installation security / ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install declared conformance dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run game installation security conformance
        run: python -B -m unittest discover -s tests/conformance -p "test_game_integration_install*.py" -v
