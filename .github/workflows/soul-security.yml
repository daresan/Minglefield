name: SOUL security guard

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'wip/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soul-security:
    name: SOUL security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate committed SOUL.md
        run: python3 -B scripts/check_soul_security.py
      - name: Scanner regression tests
        run: python3 -B -m unittest discover -s tests/conformance -p 'test_soul_security.py' -v
