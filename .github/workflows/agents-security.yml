name: AGENTS security guard

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'wip/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agents-security:
    name: AGENTS security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate committed AGENTS.md
        run: python3 -B scripts/check_agents_security.py
      - name: Scanner regression tests
        run: python3 -B -m unittest discover -s tests/conformance -p 'test_agents_security.py' -v
