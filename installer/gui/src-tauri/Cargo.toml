[package]
name = "minglefield-installer-gui"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
minglefield-installer-core = { path = "../../crates/installer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
