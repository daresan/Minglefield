name: Tauri native package smoke builds

on:
  push:
    paths:
      - "installer/gui/**"
      - ".github/workflows/installer-tauri-packaging.yml"
  pull_request:
    paths:
      - "installer/gui/**"
      - ".github/workflows/installer-tauri-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-package:
    name: Native preview package / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
          - os: windows-latest
            bundle: nsis
          - os: macos-latest
            bundle: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: installer/gui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Generate native icons from SVG master (replaces invalid preview PNG)
        run: npm run tauri -- icon icon-source.svg
      - name: Validate generated PNG icon decoding
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import struct
          import zlib

          path = pathlib.Path('src-tauri/icons/icon.png')
          data = path.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'invalid PNG signature'
          pos = 8
          chunks = []
          while pos < len(data):
              size = struct.unpack_from('>I', data, pos)[0]
              kind = data[pos + 4:pos + 8]
              payload = data[pos + 8:pos + 8 + size]
              crc = struct.unpack_from('>I', data, pos + 8 + size)[0]
              assert zlib.crc32(kind + payload) == crc, f'CRC mismatch in {kind!r}'
              chunks.append((kind, payload))
              pos += size + 12
              if kind == b'IEND':
                  break
          assert pos == len(data), 'trailing PNG data'
          assert chunks[0][0] == b'IHDR' and chunks[-1][0] == b'IEND'
          zlib.decompress(b''.join(payload for kind, payload in chunks if kind == b'IDAT'))
          print('Generated PNG: CRC and IDAT decompression OK')
          PY
      - name: Build native preview package (no release publication)
        run: npm run tauri -- build --bundles ${{ matrix.bundle }} --config '{"bundle":{"active":true}}'
      - name: Upload preview bundle for inspection
        uses: actions/upload-artifact@v7
        with:
          name: tauri-preview-${{ matrix.bundle }}
          path: installer/gui/src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7
