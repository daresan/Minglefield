name: Prepare installer SQLite lockfiles

# Manual dependency-resolution maintenance only. Never regenerate lockfiles
# or push bot commits as a side effect of normal feature-branch development.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libgtk-3-dev pkg-config
      - name: Resolve both Cargo dependency graphs
        run: |
          cargo generate-lockfile --manifest-path installer/Cargo.toml
          cargo generate-lockfile --manifest-path installer/gui/src-tauri/Cargo.toml
          cargo check --manifest-path installer/Cargo.toml --workspace --locked
          cargo check --manifest-path installer/gui/src-tauri/Cargo.toml --locked
      - name: Commit generated lockfiles
        run: |
          git add installer/Cargo.lock installer/gui/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Resolve installer and Tauri SQLite dependency lockfiles'
          git push origin HEAD:feat/game-integration-updates
