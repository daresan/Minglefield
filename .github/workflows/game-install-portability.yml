name: Game integration install portability

on:
  pull_request:
    paths:
      - "server/game_integration_install_*.py"
      - "tests/conformance/test_game_integration_install_*.py"
      - ".github/workflows/game-install-portability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation-contract:
    name: Installation contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install conformance dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run focused installation tests
        shell: bash
        run: |
          set -e
          python -B -m unittest discover -s tests/conformance -p "test_game_integration_install_preflight.py" -v
          python -B -m unittest discover -s tests/conformance -p "test_game_integration_install_paths.py" -v
          python -B -m unittest discover -s tests/conformance -p "test_game_integration_install_staging.py" -v
          python -B -m unittest discover -s tests/conformance -p "test_game_integration_install_journal.py" -v
