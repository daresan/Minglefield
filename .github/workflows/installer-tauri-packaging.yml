name: Tauri portable manager smoke builds

# Minglefield Development CI Policy v1: expensive portable release
# packaging is strictly opt-in (milestone marker -> workflow_call, or
# maintainer workflow_dispatch). Never package on ordinary push or PR.
# These are application setup-manager artifacts, NOT ComfyUI workflows.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  portable-manager:
    name: Portable setup manager preview / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-appimage
          - os: windows-latest
            artifact: windows-exe
          - os: macos-latest
            artifact: macos-app
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: installer/gui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Reuse cached Tauri Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "installer/gui/src-tauri -> target"
          shared-key: installer-gui
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build pinned Python SQLCipher and Alpha application beside portable manager
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          rm -rf src-tauri/resources/managed-alpha
          python -B ../scripts/build_managed_alpha_runtime.py --output src-tauri/resources/managed-alpha
      - name: Pin bundled managed Alpha inventory digest in Tauri binary
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          inventory = Path("src-tauri/resources/managed-alpha/managed-file-inventory.json")
          digest = hashlib.sha256(inventory.read_bytes()).hexdigest()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("MINGLEFIELD_ALPHA_INVENTORY_SHA256=" + digest + "\n")
          print("Managed application inventory compiled SHA-256:", digest)
          PY
      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Generate native icons from SVG master (replaces invalid preview PNG)
        run: npm run tauri -- icon icon-source.svg
      - name: Validate generated PNG icon decoding
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import struct
          import zlib

          config = json.loads(pathlib.Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          for relative in config['bundle']['icon']:
              icon = pathlib.Path('src-tauri') / relative
              assert icon.is_file(), f'Configured icon does not exist: {icon}'
          path = pathlib.Path('src-tauri/icons/icon.png')
          data = path.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'invalid PNG signature'
          pos = 8
          chunks = []
          while pos < len(data):
              size = struct.unpack_from('>I', data, pos)[0]
              kind = data[pos + 4:pos + 8]
              payload = data[pos + 8:pos + 8 + size]
              crc = struct.unpack_from('>I', data, pos + 8 + size)[0]
              assert zlib.crc32(kind + payload) == crc, f'CRC mismatch in {kind!r}'
              chunks.append((kind, payload))
              pos += size + 12
              if kind == b'IEND':
                  break
          assert pos == len(data), 'trailing PNG data'
          assert chunks[0][0] == b'IHDR' and chunks[-1][0] == b'IEND'
          width, height = struct.unpack_from('>II', chunks[0][1])
          assert width == height and width > 0, f'AppImage icon must be square: {width}x{height}'
          zlib.decompress(b''.join(payload for kind, payload in chunks if kind == b'IDAT'))
          print('Generated PNG: CRC and IDAT decompression OK')
          PY
      # No NSIS or DEB: the manager must not install itself.
      - name: Build directly runnable Windows executable
        if: runner.os == 'Windows'
        run: npm run tauri -- build --no-bundle
      - name: Build Linux AppImage without installing setup manager
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri -- build --bundles appimage --config '{"bundle":{"active":true}}'
      - name: Build runnable macOS application bundle (not an installer)
        if: runner.os == 'macOS'
        run: npm run tauri -- build --bundles app --config '{"bundle":{"active":true}}'
      - name: Verify Windows portable executable exists
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/minglefield-installer-gui.exe'
          if (!(Test-Path $exe -PathType Leaf)) { throw "Portable setup manager missing: $exe" }
      - name: Verify Linux AppImage exists
        if: runner.os == 'Linux'
        shell: bash
        run: |
          find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -type f -size +0c | grep -q .
      - name: Verify macOS app bundle exists
        if: runner.os == 'macOS'
        shell: bash
        run: test -d 'src-tauri/target/release/bundle/macos/Minglefield Installer.app'
      - name: Assemble portable Windows executable with its checked runtime payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable-windows -Force | Out-Null
          Copy-Item src-tauri/target/release/minglefield-installer-gui.exe portable-windows/
          Copy-Item src-tauri/resources/managed-alpha portable-windows/managed-alpha -Recurse
          if (!(Test-Path portable-windows/managed-alpha/managed-file-inventory.json)) {
            throw "Managed application resources are missing next to the Windows executable"
          }
      - name: Upload portable Windows executable and managed runtime (same directory)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-portable-windows-exe
          path: installer/gui/portable-windows/
          if-no-files-found: error
          # The pinned runtime inventory includes valid dot-prefixed, empty
          # Python distribution files. Omitting them made a green build unusable.
          include-hidden-files: true
          retention-days: 7
      # Verify the *published* payload, not only the pre-upload staging folder.
      # A missing file, including an empty hidden file, now fails packaging.
      - name: Re-download uploaded Windows artifact for inventory validation
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v8
        with:
          name: tauri-portable-windows-exe
          path: installer/gui/portable-windows-reextracted
          digest-mismatch: error
      - name: Verify re-extracted Windows artifact against binary-pinned inventory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path("../scripts").resolve()))
          from build_managed_alpha_runtime import verify_managed_file_inventory

          delivered = Path("portable-windows-reextracted")
          if not (delivered / "minglefield-installer-gui.exe").is_file():
              raise SystemExit("downloaded portable Windows executable missing")
          root = delivered / "managed-alpha"
          if not (root / "runtime-manifest.json").is_file():
              raise SystemExit("downloaded runtime manifest missing")
          count = verify_managed_file_inventory(
              root, os.environ["MINGLEFIELD_ALPHA_INVENTORY_SHA256"])
          if count <= 0:
              raise SystemExit("downloaded managed runtime inventory is empty")
          print("Re-downloaded Windows managed Alpha inventory verified:", count, "entries")
          '@ | python -B -
      - name: Upload Linux AppImage preview
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-portable-linux-appimage
          path: installer/gui/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - name: Archive macOS app preserving bundle permissions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent 'Minglefield Installer.app' Minglefield-Setup-Manager-macOS.zip
      - name: Verify archived macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test -s src-tauri/target/release/bundle/macos/Minglefield-Setup-Manager-macOS.zip
          unzip -l src-tauri/target/release/bundle/macos/Minglefield-Setup-Manager-macOS.zip | grep -F 'Minglefield Installer.app/Contents/MacOS/'
      - name: Upload macOS app preview
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-portable-macos-app
          path: installer/gui/src-tauri/target/release/bundle/macos/Minglefield-Setup-Manager-macOS.zip
          if-no-files-found: error
          retention-days: 7
