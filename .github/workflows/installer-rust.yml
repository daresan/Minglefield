name: Installer Rust checks

# Minglefield Development CI Policy v1 (not ComfyUI workflow execution).
# Fast Ubuntu checks on ordinary pushes; full OS matrix on PR/explicit gate.
on:
  push:
    paths:
      - "installer/crates/**"
      - "!installer/crates/**/*.md"
      - "installer/Cargo.toml"
      - "installer/Cargo.lock"
      - "installer/scripts/**"
      - "requirements-ci.txt"
      - "server/alpha_sqlcipher_runtime.py"
      - "server/private_alpha_auth.py"
      - "server/private_alpha_gateway.py"
      - "tests/conformance/test_installed_local_alpha_gateway.py"
      - "server/sec01_host_commit_policy_sim.py"
      - "server/sec01_integrated_alpha_admission.py"
      - ".github/workflows/installer-rust.yml"
  pull_request:
    paths:
      - "installer/crates/**"
      - "installer/Cargo.toml"
      - "installer/Cargo.lock"
      - "installer/scripts/**"
      - "requirements-ci.txt"
      - "server/alpha_sqlcipher_runtime.py"
      - "server/private_alpha_auth.py"
      - "server/private_alpha_gateway.py"
      - "tests/conformance/test_installed_local_alpha_gateway.py"
      - "server/sec01_host_commit_policy_sim.py"
      - "server/sec01_integrated_alpha_admission.py"
      - ".github/workflows/installer-rust.yml"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run the installer core on Windows, Linux and macOS"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: installer-core-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'pull_request' || inputs.full_matrix == true) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache shared installer Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "installer -> target"
          shared-key: installer-core
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Set up Python 3.11 for cross-runtime SQLCipher acceptance
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install declared Python SQLCipher conformance runtime
        run: python -m pip install -r ../requirements-ci.txt
      - name: Verify Rust exported and final fixture ciphertext with Python login and Host ownership
        run: cargo test -p minglefield-installer-core --locked cross_runtime_ -- --ignored
      - name: Verify installed encrypted Alpha login and Host scope over loopback
        run: python -B -m unittest discover -s ../tests/conformance -p "test_installed_local_alpha_gateway.py" -v
      - name: Offline installer release preparation tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Inspect transitive Alpha runtime imports (read-only)
        run: python scripts/audit_alpha_runtime_imports.py --json
      - name: Inspect Git and gh executable invocation sites (read-only)
        run: python scripts/audit_external_executables.py --json
