<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minglefield Installer</title>
<style>
body{font:16px system-ui,sans-serif;background:#101827;color:#f2f5fa;margin:0;padding:32px}main{max-width:680px;margin:auto}label{display:block;margin:20px 0 8px}input{box-sizing:border-box;width:100%;padding:12px;background:#fff;color:#111;border-radius:6px;border:0}button{margin-top:18px;padding:12px 20px;border:0;border-radius:6px;background:#74c8b3;color:#101827;font-weight:bold;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#1c293b;border-radius:6px}small{color:#b4c5d9}
</style></head>
<body><main><h1>Minglefield Installer</h1><p>Installation preview — no files will be changed.</p>
<label for="destination">Installation directory</label><input id="destination" aria-label="Installation directory" />
<button id="preview">Validate installation plan</button>
<pre id="result" role="status" aria-live="polite">Loading default location…</pre>
<small>Optional runtimes and Host provisioning are disabled in this prototype. Installation and trust verification are not implemented.</small>
</main><script type="module" src="/main.js"></script></body></html>
